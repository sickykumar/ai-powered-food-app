<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1438"/>
      <stop offset="70%" stop-color="#0a0818"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>

    <!-- RGB Neon Border Gradient -->
    <linearGradient id="rgbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Glowing Cloche Dome Gradient -->
    <linearGradient id="domeGrad" x1="20%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f2fe"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Cloche Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- AI Core Sparkle Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container with RGB Stroke -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#rgbBorder)" stroke-width="4.5"/>

  <!-- Subtle Perspective Grid / Ambience -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Outer Neon Cloche Glow Effect -->
  <g filter="url(#neonGlow)">
    <!-- Cloche Handle / AI Crown Node -->
    <circle cx="64" cy="34" r="7" fill="url(#rgbBorder)"/>
    <circle cx="64" cy="34" r="3.5" fill="#ffffff"/>

    <!-- Cloche Main Dome -->
    <path d="M 32 72 C 32 46, 96 46, 96 72 Z" fill="url(#domeGrad)" fill-opacity="0.92"/>

    <!-- Cloche Platter Base / Rim -->
    <rect x="24" y="75" width="80" height="7.5" rx="3.75" fill="url(#rimGrad)"/>

    <!-- Platter Bottom Stand -->
    <path d="M 44 83 L 50 91 L 78 91 L 84 83 Z" fill="url(#rgbBorder)" opacity="0.85"/>
  </g>

  <!-- Glowing AI Culinary Sparkles -->
  <!-- Top Right Sparkle -->
  <path d="M 94 30 Q 94 38 102 38 Q 94 38 94 46 Q 94 38 86 38 Q 94 38 94 30 Z" fill="#00f2fe"/>
  <!-- Bottom Left Micro Sparkle -->
  <path d="M 28 42 Q 28 46 32 46 Q 28 46 28 50 Q 28 46 24 46 Q 28 46 28 42 Z" fill="#ff007f"/>

  <!-- Center Cloche Emblem / AI Aperture -->
  <circle cx="64" cy="62" r="5" fill="url(#coreGlow)"/>
  <circle cx="64" cy="62" r="2.2" fill="#ffffff"/>

  <!-- High-Tech Micro-Aperture Accent Ring -->
  <circle cx="64" cy="62" r="9" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.9"/>
</svg>